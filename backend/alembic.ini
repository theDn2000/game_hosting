# Alembic configuration. It deliberately contains NO database URL or secret:
# migrations/env.py reads GAME_HOSTING_DATABASE_URL from the environment.
# Run from the backend/ directory, for example:
#   python -m alembic upgrade head

[alembic]
script_location = %(here)s/migrations
# Sortable file names: 0001_initial_schema.py, 0002_..., and so on.
file_template = %%(rev)s_%%(slug)s
