services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-dev
    labels:
      game-hosting.managed: "true"
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "VANILLA"
      VERSION: "LATEST"
      MEMORY: "4G"
    volumes:
      - ./data:/data
    restart: unless-stopped