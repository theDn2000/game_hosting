services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-dev
    labels:
      game-hosting.managed: "true"
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "VANILLA"
      VERSION: "LATEST"
      MEMORY: "4G"
    volumes:
      - ./data:/data
    restart: unless-stopped

  # Platform database. Deliberately NOT labelled game-hosting.managed, so the
  # API and the CLI can never start, stop or read it. Credentials come from
  # .env (not committed); see .env.example.
  postgres:
    image: postgres:18
    container_name: game-hosting-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gamehosting}
      POSTGRES_DB: ${POSTGRES_DB:-gamehosting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      # Localhost only; never publish the database on a public interface.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep their data under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres-data:
